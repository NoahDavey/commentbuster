# Cut a release by tagging: `git tag v0.2.0 && git push origin v0.2.0`.
# The tag must match the version in Cargo.toml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN: commentbuster

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml version
        run: |
          crate="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$crate" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml $crate" >&2
            exit 1
          fi

  build:
    needs: check
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-apple-darwin,       os: macos-latest }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -eu
          staging="$BIN-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/$BIN" "$staging/"
          cp hooks/claude-precommit-gate.sh "$staging/$BIN-claude-gate"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          "./$staging/$BIN" --version
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: ${{ env.BIN }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          for f in *.tar.gz; do sha256sum "$f"; done > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
